<style>
:root{
  --orange:#412206; --orange-dark:#ff7707;
  --bg:#ffffff; --bg2:#f5f6f8; --text:#040404; --muted:#6b7280; --border:#e5e7eb; --card:#ffffff;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121417; --bg2:#1b1e22; --text:#f2f3f5; --muted:#9aa0a6; --border:#2a2d31; --card:#1b1e22;
  }
}
:root[data-theme="dark"]{
  --bg:#121417; --bg2:#1b1e22; --text:#f2f3f5; --muted:#9aa0a6; --border:#2a2d31; --card:#1b1e22;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;height:100%;}
html{height:100%;}
header{
  position:sticky; top:0; z-index:20; background:var(--orange); color:#fff;
  padding:calc(env(safe-area-inset-top,0px) + 10px) 14px 10px;
}
.top-row{display:flex;align-items:center;gap:10px;}
.logo{font-weight:800;font-size:1.2rem;white-space:nowrap;}
.logo span{font-weight:400;font-size:.7rem;display:block;opacity:.9;}
.search{flex:1;display:flex;align-items:center;background:#fff;border-radius:20px;padding:8px 12px;gap:6px;}
.search input{border:none;outline:none;flex:1;font-size:.9rem;color:#111;background:transparent;}
.cart-btn{position:relative;background:rgba(255,255,255,.15);border:none;color:#fff;border-radius:50%;width:40px;height:40px;font-size:1.1rem;flex-shrink:0;}
.badge{position:absolute;top:-4px;right:-4px;background:#111;color:#fff;font-size:.65rem;border-radius:10px;padding:1px 5px;min-width:16px;}
.cats{display:flex;gap:8px;overflow-x:auto;margin-top:10px;padding-bottom:4px;scrollbar-width:none;}
.cats::-webkit-scrollbar{display:none;}
.cat-chip{flex-shrink:0;background:rgba(255,255,255,.18);color:#fff;border:none;border-radius:14px;padding:6px 12px;font-size:.8rem;white-space:nowrap;}
.cat-chip.active{background:#fff;color:var(--orange-dark);font-weight:700;}
main{max-width:900px;margin:0 auto;padding:14px 14px 90px;}
.banner{background:linear-gradient(135deg,var(--orange),#874609);color:#fff;border-radius:14px;padding:16px;margin-bottom:16px;}
.banner b{font-size:1rem;}
.banner p{margin:4px 0 0;font-size:.8rem;opacity:.95;}
.section-title{font-size:1rem;font-weight:700;margin:18px 0 10px;}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;}
@media(min-width:600px){.grid{grid-template-columns:repeat(3,1fr);}}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;}
.thumb{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:2.2rem;position:relative;}
.photo-dots{position:absolute;bottom:5px;left:0;right:0;display:flex;justify-content:center;gap:4px;}
.photo-dots .dot{width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,.6);box-shadow:0 0 2px rgba(0,0,0,.4);}
.photo-dots .dot.active{background:#fff;}
.card-body{padding:8px 10px 10px;flex:1;display:flex;flex-direction:column;gap:4px;}
.card-title{font-size:.82rem;font-weight:600;line-height:1.2;min-height:2.2em;}
.card-price{color:var(--orange-dark);font-weight:800;font-size:.95rem;}
.card-meta{font-size:.7rem;color:var(--muted);display:flex;justify-content:space-between;}
.add-btn{margin-top:4px;background:var(--orange);color:#fff;border:none;border-radius:8px;padding:7px;font-size:.78rem;font-weight:700;}
.add-btn:active{background:var(--orange-dark);}
.trust{display:flex;gap:10px;overflow-x:auto;margin-top:16px;}
.trust-item{flex-shrink:0;background:var(--bg2);border-radius:10px;padding:10px 12px;font-size:.75rem;min-width:140px;border:1px solid var(--border);}
.trust-item b{display:block;font-size:.85rem;margin-bottom:2px;}
/* Drawer */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40;display:none;}
.overlay.open{display:block;}
.drawer{
  position:fixed;right:0;top:0;bottom:0;width:min(380px,92vw);background:var(--bg);z-index:50;
  transform:translateX(100%);transition:transform .25s ease;display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
.drawer.open{transform:translateX(0);}
.drawer-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--border);}
.drawer-head h3{margin:0;font-size:1rem;}
.close-btn{background:none;border:none;font-size:1.3rem;color:var(--text);}
.drawer-body{flex:1;overflow-y:auto;padding:10px 16px;}
.cart-row{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--border);}
.cart-thumb{width:44px;height:44px;border-radius:8px;background:var(--bg2);display:flex;align-items:center;justify-content:center;font-size:1.4rem;flex-shrink:0;}
.cart-info{flex:1;}
.cart-info .name{font-size:.82rem;font-weight:600;}
.cart-info .price{font-size:.78rem;color:var(--muted);}
.qty{display:flex;align-items:center;gap:6px;}
.qty button{width:24px;height:24px;border-radius:6px;border:1px solid var(--border);background:var(--bg2);color:var(--text);font-size:.9rem;}
.empty{text-align:center;color:var(--muted);padding:40px 10px;font-size:.85rem;}
.drawer-foot{border-top:1px solid var(--border);padding:14px 16px;}
.foot-row{display:flex;justify-content:space-between;font-size:.85rem;margin-bottom:4px;color:var(--muted);}
.foot-row.total{color:var(--text);font-weight:800;font-size:1rem;}
.checkout-btn{width:100%;margin-top:10px;background:var(--orange);color:#fff;border:none;border-radius:10px;padding:12px;font-weight:800;font-size:.9rem;}
.checkout-btn:disabled{opacity:.5;}
/* Checkout modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:60;display:none;align-items:flex-end;justify-content:center;}
.modal-overlay.open{display:flex;}
.modal{background:var(--bg);width:100%;max-width:420px;border-radius:16px 16px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));max-height:85vh;overflow-y:auto;}
.modal h3{margin:0 0 12px;font-size:1.05rem;}
.pay-opt{display:flex;align-items:center;gap:10px;border:2px solid var(--border);border-radius:10px;padding:12px;margin-bottom:8px;cursor:pointer;}
.pay-opt.selected{border-color:var(--orange);background:rgba(255,122,0,.06);}
.pay-opt .icon{font-size:1.3rem;}
.pay-opt .label{font-weight:700;font-size:.88rem;}
.pay-opt .sub{font-size:.72rem;color:var(--muted);}
.radio{width:20px;height:20px;border-radius:50%;border:2px solid var(--border);flex-shrink:0;position:relative;}
.radio.checked{border-color:var(--orange);}
.radio.checked::after{content:'';position:absolute;inset:3px;background:var(--orange);border-radius:50%;}
textarea.addr{width:100%;padding:10px;border:1px solid var(--border);border-radius:8px;background:var(--bg2);color:var(--text);font-size:.85rem;min-height:70px;font-family:inherit;resize:vertical;}
.confirm-btn{width:100%;background:var(--orange);color:#fff;border:none;border-radius:10px;padding:13px;font-weight:800;margin-top:10px;font-size:.9rem;}
.success{text-align:center;padding:20px 0;}
.success .check{font-size:2.5rem;}
footer.tabbar{
  position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--border);
  display:flex;justify-content:space-around;padding:8px 0 calc(8px + env(safe-area-inset-bottom,0px));z-index:15;
}
.tab{background:none;border:none;color:var(--muted);font-size:.68rem;display:flex;flex-direction:column;align-items:center;gap:2px;}
.tab.active{color:var(--orange-dark);font-weight:700;}
.tab .ico{font-size:1.1rem;}
.form-group{margin-bottom:10px;}
.form-group label{font-size:.75rem;color:var(--muted);display:block;margin-bottom:4px;}
.form-group input, .form-group select{width:100%;padding:10px;border:1px solid var(--border);border-radius:8px;background:var(--bg2);color:var(--text);font-size:.85rem;}
.seller-badge{font-size:.62rem;background:var(--orange);color:#fff;padding:1px 6px;border-radius:6px;display:inline-block;margin-top:2px;}
.product-row-admin{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border);font-size:.82rem;gap:8px;}
.small-btn{background:none;border:1px solid var(--border);border-radius:6px;padding:4px 8px;font-size:.7rem;color:var(--text);flex-shrink:0;}
</style>
</head>

  {id:8,name:"Esemble pour homme",price:0,cat:"Mode",emoji:"👡",photos:["https://i.ibb.co/LzJfTtXc/Whats-App-Image-2026-09-26-at-15-20-37.jpg","https://i.ibb.co/r2KXhJT0/Whats-App-Image-2026-09-26-at-15-20-38-2.jpg","https://i.ibb.co/M556WqjF/Whats-App-Image-2026-09-26-at-15-20-39.jpg",""]},
  {id:9,name:"savon",price:0,cat:"Cosmetique",emoji:"🌀",photos:["https://i.ibb.co/3yg3fKDq/Whats-App-Image-2026-09-26-at-23-00-08.jpg","https://i.ibb.co/qYcqLbmR/Whats-App-Image-2026-09-26-at-23-08-01.jpg","https://i.ibb.co/YFhF8MXj/Whats-App-Image-2026-09-26-at-23-10-23.jpg",""]},
];
const baseCategories = ["Électronique","Mode","cosmetique"];
let categories = ["Tous", ...baseCategories, "Autre"];
let activeCat = "Tous";
let cart = {}; // id -> qty
let sellerProducts = [];
let products = [];
let currentSeller = null;
let currentUser = null;
let buyerPhone = '';
let buyerName = '';
let buyerAddr = '';
let photoIndex = {}; // id -> index de la photo actuellement affichée
let buyerCoords = null;
let proximityActive = false;

function distanceKm(lat1, lon1, lat2, lon2){
  const R = 6371;
  const dLat = (lat2-lat1)*Math.PI/180;
  const dLon = (lon2-lon1)*Math.PI/180;
  const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

function enableProximity(){
  const btn = document.getElementById('proxBtn');
  if(!navigator.geolocation){ alert('La géolocalisation n\'est pas supportée sur cet appareil.'); return; }
  btn.textContent = '📍 Localisation en cours...';
  navigator.geolocation.getCurrentPosition(pos=>{
    buyerCoords = { lat: pos.coords.latitude, lon: pos.coords.longitude };
    proximityActive = true;
    btn.textContent = '📍 Triés par proximité ✓';
    renderGrid();
  }, err=>{
    btn.textContent = '📍 Trier par vendeurs proches';
    alert('Impossible d\'obtenir ta position : '+err.message);
  }, {timeout:8000});
}

function getPhotos(p){ return (p.photos||[]).filter(Boolean); }

// Si une photo échoue à charger (réseau mobile instable), on réessaie une fois avant d'afficher l'emoji
function imgFail(el, emoji){
  if(!el.dataset.retry){
    el.dataset.retry = '1';
    const src = el.src;
    setTimeout(()=>{ el.src = src + (src.includes('?') ? '&' : '?') + 'r=' + Date.now(); }, 1500);
    return;
  }
  el.style.display = 'none';
  el.parentElement.insertAdjacentHTML('beforeend', emoji);
}

// Réduit les photos du téléphone (souvent 3 à 8 Mo) avant de les envoyer
async function compressImage(file, max=1000, quality=0.8){
  try{
    const bmp = await createImageBitmap(file);
    const scale = Math.min(1, max / Math.max(bmp.width, bmp.height));
    const w = Math.round(bmp.width*scale), h = Math.round(bmp.height*scale);
    const canvas = document.createElement('canvas');
    canvas.width = w; canvas.height = h;
    canvas.getContext('2d').drawImage(bmp, 0, 0, w, h);
    const blob = await new Promise(res => canvas.toBlob(res, 'image/jpeg', quality));
    return blob || file;
  }catch(e){ return file; }
}
function cyclePhoto(id, total, evt){
  evt.stopPropagation();
  photoIndex[id] = ((photoIndex[id]||0)+1) % total;
  renderGrid();
}
function refreshProducts(){
  products = baseProducts.concat(sellerProducts);
  refreshCategories();
  renderCats();
}

function fmt(n){ return n.toLocaleString('fr-FR') + " FCFA"; }

function renderCats(){
  const row = document.getElementById('catRow');
  row.innerHTML = categories.map((c,i) =>
    `<button class="cat-chip ${sameCat(c,activeCat)?'active':''}" onclick="setCatIdx(${i})">${esc(c)}</button>`
  ).join('');
}
function setCatIdx(i){ activeCat = categories[i]; renderCats(); renderGrid(); }

function normCat(s){
  return String(s||'').trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
}
function esc(s){
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
// Les catégories = celles de base + toutes celles utilisées par les vendeurs
function refreshCategories(){
  const seen = new Set(['autre','tous']);
  const list = [];
  [...baseCategories, ...products.map(p=>p.cat)].forEach(c=>{
    const label = String(c||'').trim();
    const k = normCat(label);
    if(!label || seen.has(k)) return;
    seen.add(k); list.push(label);
  });
  categories = ['Tous', ...list, 'Autre'];
  if(!categories.some(c=>sameCat(c, activeCat))) activeCat = 'Tous';
}

function sameCat(a, b){
  return normCat(a) === normCat(b);
}

function renderGrid(){
  const q = document.getElementById('searchInput').value.toLowerCase();
  const grid = document.getElementById('productGrid');
  let filtered = products.filter(p =>
    (activeCat==="Tous" || sameCat(p.cat, activeCat)) &&
    p.name.toLowerCase().includes(q)
  );

  filtered = filtered.map(p=>{
    const dist = (proximityActive && buyerCoords && p.vendorLat!=null && p.vendorLon!=null)
      ? distanceKm(buyerCoords.lat, buyerCoords.lon, p.vendorLat, p.vendorLon) : null;
    return {...p, dist};
  });
  if(proximityActive){
    filtered.sort((a,b)=>{
      if(a.dist==null && b.dist==null) return 0;
      if(a.dist==null) return 1;
      if(b.dist==null) return -1;
      return a.dist - b.dist;
    });
  }
  document.getElementById('gridTitle').textContent = q ? `Résultats pour "${q}"` : "Produits populaires";
  grid.innerHTML = filtered.map(p => {
    const photos = getPhotos(p);
    const idx = photos.length ? (photoIndex[p.id]||0) % photos.length : 0;
    const thumbInner = photos.length
      ? `<img src="${photos[idx]}" alt="${esc(p.name)}" loading="lazy" decoding="async" style="width:100%;height:100%;object-fit:cover;" onerror="imgFail(this,'${p.emoji}')">
         ${photos.length>1 ? `<div class="photo-dots">${photos.map((_,i)=>`<span class="dot ${i===idx?'active':''}"></span>`).join('')}</div>` : ''}`
      : p.emoji;
    const thumbClick = photos.length>1 ? `onclick="cyclePhoto('${esc(p.id)}',${photos.length},event)"` : '';
    return `
    <div class="card">
      <div class="thumb" style="background:var(--bg2);${photos.length?'padding:0;cursor:pointer;':''}" ${thumbClick}>${thumbInner}</div>
      <div class="card-body">
        <div class="card-title">${esc(p.name)}</div>
        <div class="card-price">${fmt(p.price)}</div>
        <div class="card-meta"><span>${esc(p.cat)}</span><span> </span></div>
        ${p.shop ? `<div class="seller-badge">🏪 ${esc(p.shop)}</div>` : ''}
        ${p.dist!=null ? `<div class="seller-badge" style="background:#16a34a;">📍 ${p.dist.toFixed(1)} km</div>` : ''}
        <button class="add-btn" onclick="addToCart('${esc(p.id)}')">Ajouter au panier</button>
      </div>
    </div>`;
  }).join('') || '<div class="empty" style="grid-column:1/-1;">Aucun produit trouvé</div>';
}

function addToCart(id){
  cart[id] = (cart[id]||0)+1;
  saveCart(); updateBadge(); renderCartBody();
}
function changeQty(id, delta){
  cart[id] = (cart[id]||0)+delta;
  if(cart[id]<=0) delete cart[id];
  saveCart(); updateBadge(); renderCartBody();
}
function cartCount(){ return Object.values(cart).reduce((a,b)=>a+b,0); }
function updateBadge(){ document.getElementById('cartBadge').textContent = cartCount(); }

function renderCartBody(){
  const body = document.getElementById('cartBody');
  const foot = document.getElementById('cartFoot');
  const ids = Object.keys(cart).filter(id => products.find(x=>x.id==id));
  if(ids.length===0){
    body.innerHTML = '<div class="empty">Votre panier est vide 🛒<br>Ajoutez des produits pour commencer.</div>';
    foot.style.display='none';
    return;
  }
  let subtotal = 0;
  body.innerHTML = ids.map(id=>{
    const p = products.find(x=>x.id==id);
    const qty = cart[id];
    subtotal += p.price*qty;
    const photos = getPhotos(p);
    return `<div class="cart-row">
      <div class="cart-thumb" style="${photos.length?'padding:0;overflow:hidden;':''}">${photos.length ? `<img src="${photos[0]}" alt="${p.name}" style="width:100%;height:100%;object-fit:cover;" onerror="imgFail(this,'${p.emoji}')">` : p.emoji}</div>
      <div class="cart-info">
        <div class="name">${p.name}</div>
        <div class="price">${fmt(p.price)}</div>
      </div>
      <div class="qty">
        <button onclick="changeQty('${esc(id)}',-1)">−</button>
        <span>${qty}</span>
        <button onclick="changeQty('${esc(id)}',1)">+</button>
      </div>
    </div>`;
  }).join('');
  const shipping = subtotal>0 ? 1500 + Math.floor(subtotal*0.01) : 0;
  document.getElementById('subtotal').textContent = fmt(subtotal);
  document.getElementById('shipping').textContent = fmt(shipping);
  document.getElementById('total').textContent = fmt(subtotal+shipping);
  foot.style.display='block';
}

function openCart(){ document.getElementById('drawer').classList.add('open'); document.getElementById('overlay').classList.add('open'); }
function closeCart(){ document.getElementById('drawer').classList.remove('open'); document.getElementById('overlay').classList.remove('open'); }

function cartTotals(){
  let subtotal = 0;
  Object.keys(cart).forEach(id=>{
    const p = products.find(x=>x.id==id);
    if(p) subtotal += p.price*cart[id];
  });
  const shipping = subtotal>0 ? 1500 + Math.floor(subtotal*0.01) : 0;
  return { subtotal, shipping, total: subtotal+shipping };
}

async function confirmOrder(){
  const nameInput = document.getElementById('buyerNameInput');
  const phoneInput = document.getElementById('buyerPhoneInput');
  const addrInput = document.getElementById('buyerAddrInput');
  if(nameInput) buyerName = nameInput.value.trim();
  if(phoneInput) buyerPhone = phoneInput.value.trim();
  if(addrInput) buyerAddr = addrInput.value.trim();
  if(!buyerName || !buyerPhone || !buyerAddr){ alert('Merci de remplir le nom, le téléphone et l\'adresse de livraison.'); return; }
  try{
    localStorage.setItem('senemarket_buyer_phone', buyerPhone);
    localStorage.setItem('senemarket_buyer_name', buyerName);
  }catch(e){}

  const rows = Object.keys(cart).map(id=>{
    const p = products.find(x=>x.id==id);
    if(!p) return null;
    return {
      acheteur_telephone: buyerPhone,
      acheteur_nom: buyerName,
      acheteur_id: currentUser ? currentUser.id : null,
      adresse_livraison: buyerAddr,
      produit_id: typeof p.id === 'string' ? p.id : null,
      vendeur_id: typeof p.vendeurId === 'string' ? p.vendeurId : null,
      quantite: cart[id],
      total: p.price*cart[id],
      mode_paiement: selectedPay,
      statut: 'payee'
    };
  }).filter(Boolean);

  try{
    const { error } = await sb.from('commandes').insert(rows);
    if(error) throw error;
    renderCheckoutSuccess();
  }catch(e){
    alert("Erreur lors de l'enregistrement de la commande : "+(e.message||e));
  }
}

function renderCheckoutSuccess(){
  const modal = document.getElementById('checkoutModal');
  modal.innerHTML = `
    <div class="success">
      <div class="check">✅</div>
      <h3>Commande confirmée !</h3>
      <p style="color:var(--muted);font-size:.85rem;">Votre argent est protégé jusqu'à réception. Vous recevrez une notification à chaque étape de la livraison.</p>
      <button class="confirm-btn" onclick="finishOrder()">Retour à l'accueil</button>
    </div>`;
}
function finishOrder(){

}

function subscribeSellerNotifications(){
  if(!currentSeller) return;
  if('Notification' in window && Notification.permission === 'default'){
    Notification.requestPermission();
  }
  sb.channel('commandes-vendeur-'+currentSeller.id)
    .on('postgres_changes', { event:'INSERT', schema:'public', table:'commandes', filter:`vendeur_id=eq.${currentSeller.id}` }, payload=>{
      showSellerNotification(payload.new);
    })
    .subscribe();
}

function showSellerNotification(order){
  const div = document.createElement('div');
  div.textContent = `🔔 Nouvelle commande reçue — ${fmt(order.total)} (${order.mode_paiement||''})`;
  div.style.cssText = 'position:fixed;top:calc(env(safe-area-inset-top,0px) + 70px);left:50%;transform:translateX(-50%);background:#16a34a;color:#fff;padding:10px 16px;border-radius:10px;font-size:.85rem;z-index:999;box-shadow:0 4px 14px rgba(0,0,0,.25);max-width:90vw;text-align:center;';

  if('Notification' in window && Notification.permission === 'granted'){
    try{ new Notification('SénéMarket', { body: `Nouvelle commande — ${fmt(order.total)}` }); }catch(e){}
  }
}

async function registerSeller(){
  if(!currentUser){ alert('Merci de te connecter (onglet Compte) avant de créer ta boutique.'); return; }
  const name=document.getElementById('selName').value.trim();
  const shop=document.getElementById('selShop').value.trim();
  const phone=document.getElementById('selPhone').value.trim();
  const cat=null;
  if(!name||!shop||!phone){ alert('Merci de remplir tous les champs.'); return; }
  let lat=null, lon=null;
  try{
    const pos = await new Promise((resolve,reject)=>{
      if(!navigator.geolocation) return reject();
      navigator.geolocation.getCurrentPosition(resolve, reject, {timeout:8000});
    });
    lat = pos.coords.latitude; lon = pos.coords.longitude;
  }catch(e){ /* position refusée ou indisponible, on continue sans */ }
  try{
    const { data, error } = await sb.from('vendeurs')
      .insert({nom:name, boutique:shop, telephone:phone, categorie:cat, latitude:lat, longitude:lon, user_id: currentUser.id})
      .select().single();
    if(error) throw error;
    currentSeller = {id:data.id, name, shop, phone, cat};
    saveSellerLocal();
    subscribeSellerNotifications();
    renderSellerModal();
  }catch(e){
    alert("Erreur lors de la création de la boutique : "+(e.message||e));
  }
}

async function addSellerProduct(){
  const name=document.getElementById('prName').value.trim();
  const price=parseInt(document.getElementById('prPrice').value,10);
  let cat=document.getElementById('prCat').value;
  if(cat==='Autre'){
    const other=document.getElementById('prCatOther').value.trim();
    if(other) cat=other.slice(0,30);
  }
  const emoji=document.getElementById('prEmoji').value;
  const file=document.getElementById('prPhoto').files[0];
  if(!name||!price){ alert('Merci de renseigner le nom et le prix.'); return; }
  try{
    let photoUrl = null;
    if(file){
      const blob = await compressImage(file);
      const ext = (blob.type.split('/')[1] || 'jpg').replace(/[^a-z0-9]/g,'');
      const path = `${currentSeller.id}/${Date.now()}.${ext}`;
      const { error: upErr } = await sb.storage.from('produits').upload(path, blob, { contentType: blob.type || 'image/jpeg', cacheControl: '31536000' });
      if(upErr) throw new Error('Envoi de la photo refusé : ' + upErr.message);
      const { data: urlData } = sb.storage.from('produits').getPublicUrl(path);
      photoUrl = urlData.publicUrl;
    }
    const { error } = await sb.from('produits')
      .insert({vendeur_id: currentSeller.id, nom:name, prix:price, categorie:cat, icone:emoji, photo_url: photoUrl});
    if(error) throw new Error('Enregistrement du produit refusé : ' + error.message);
    await loadAllProducts();
    renderGrid();
    renderSellerModal();
  }catch(e){
    alert("Erreur lors de l'ajout du produit : "+(e.message||e));
  }
}

async function removeSellerProduct(id){
  try{

    await loadAllProducts();

async function doSignIn(){

  if(!email || !password){ msg.textContent = 'Merci de remplir email et mot de passe.'; return; }
  msg.textContent = 'Connexion...';
  const { data, error } = await sb.auth.signInWithPassword({ email, password });
  if(error){ msg.textContent = 'Erreur : '+error.message; return; }
  currentUser = data.user;
  renderAccountModal();
}

async function doSignOut(){
  await sb.auth.signOut();
  currentUser = null;
  clearSeller();
  renderAccountModal();
}

async function initAuth(){
  const { data } = await sb.auth.getSession();
  currentUser = data.session ? data.session.user : null;
  await syncSellerFromAccount();
  sb.auth.onAuthStateChange(async (event, session)=>{
    currentUser = session ? session.user : null;
    await syncSellerFromAccount();
  });
}

function clearSeller(){
  currentSeller = null;
  try{ localStorage.removeItem('senemarket_seller'); }catch(e){}
}

async function syncSellerFromAccount(){
  if(!currentUser){ clearSeller(); return; }
  try{
    const { data, error } = await sb.from('vendeurs').select('*').eq('user_id', currentUser.id).maybeSingle();
    if(error) return;
    if(data){
      currentSeller = {id:data.id, name:data.nom, shop:data.boutique, phone:data.telephone, cat:data.categorie};
      saveSellerLocal();
      subscribeSellerNotifications();
    } else {
      clearSeller();
    }
  }catch(e){ /* réseau indisponible : on garde l'état actuel */ }
}

document.getElementById('searchInput').addEventListener('input', renderGrid);

loadCart();
loadSeller();
loadBuyerPhone();
initAuth();
refreshProducts();
renderCats();
renderGrid();
updateBadge();
renderCartBody();
loadAllProducts().then(renderGrid);
</script>
</body>
